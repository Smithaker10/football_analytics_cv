name: 🚀 Feature Request
description: Suggest an idea or enhancement for Football Analytics CV
labels: ["enhancement"]
body:
  - type: textarea
    id: feature
    attributes:
      label: Feature Description
      description: What feature or tactical analytic would you like to see added?
    validations:
      required: true
  - type: textarea
    id: use_case
    attributes:
      label: Tactical / CV Use Case
      description: How will this improve match analysis or tracking performance?
    validations:
      required: false
